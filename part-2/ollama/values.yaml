image:
  repository: ollama/ollama
  tag: latest
  pullPolicy: IfNotPresent

model:
  name: qwen2.5:0.5b

service:
  type: ClusterIP
  port: 11434

persistence:
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

webui:
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: main
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 3Gi
