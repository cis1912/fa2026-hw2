apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-pull-model
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # TODO: Helm hooks let a chart run one-off work at specific points in a
    # release's lifecycle, instead of you remembering to `kubectl exec` by
    # hand like in Part 1. Make this Job run after both a fresh install AND
    # an upgrade (comma-separated hook names), and tell Helm to delete any
    # previous run of this Job before creating a new one.
    # See: https://helm.sh/docs/topics/charts_hooks/
    "helm.sh/hook":
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy":
spec:
  backoffLimit: 6 # we've set this up for you as a reasonable default
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull-model
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: OLLAMA_HOST
              # TODO: same Service DNS name you used in webui-deployment.yaml
              value:
          command:
            - sh
            - -c
            - |
              until ollama list >/dev/null 2>&1; do
                echo "waiting for ollama server at $OLLAMA_HOST..."
                sleep 3
              done
              # TODO: pull .Values.model.name instead of a hardcoded model
              ollama pull
